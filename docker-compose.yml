# TrueNAS : Apps › Discover Apps › ⋮ › Install via YAML, puis coller ce fichier.
# Remplacer <pool> et les deux secrets.
services:
  app-running:
    image: ghcr.io/asayet44/running-fiouf:latest
    container_name: app-running
    restart: unless-stopped
    user: "568:568" # utilisateur "apps" de TrueNAS, propriétaire des datasets
    ports:
      - "3000:3000"
    environment:
      SESSION_SECRET: "<résultat de: openssl rand -hex 32>"
      CLAUDE_CODE_OAUTH_TOKEN: "<résultat de: claude setup-token>"
      # SIGNUP_CODE: "<code à donner aux coureurs pour créer leur compte>"
    volumes:
      - /mnt/<pool>/apps/app-running/config:/config
      - /mnt/<pool>/apps/app-running/data:/data
      # Optionnel : dossiers de projets Claude des coureurs présents sur le TrueNAS
      # - /mnt/<pool>/<dossier du projet>:/runners/<nom>
